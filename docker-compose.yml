services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in your env file}
      POSTGRES_USER: ${DB_USER:?Set DB_USER in your env file}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your env file}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" && psql -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -tAc \"SELECT EXISTS (SELECT 1 FROM pg_extension WHERE extname='postgis')\" | grep -qx t"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  migrate:
    image: postgis/postgis:16-3.4
    entrypoint: ["/bin/sh", "-ec"]
    command: ["for file in /migrations/*.sql; do psql \"postgresql://$${DB_USER}:$${DB_PASSWORD}@$${DB_HOST}:$${DB_PORT}/$${DB_NAME}\" -v ON_ERROR_STOP=1 -f \"$$file\"; done"]
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:?Set DB_NAME in your env file}
      DB_USER: ${DB_USER:?Set DB_USER in your env file}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your env file}
    volumes:
      - ./migrations:/migrations:ro
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  worker:
    build: .
    environment:
      COUNTRY_CODE: ${COUNTRY_CODE:?Set COUNTRY_CODE in your env file}
      REGION_CODE: ${REGION_CODE:?Set REGION_CODE in your env file}
      SOURCE_ENDPOINT: ${SOURCE_ENDPOINT:?Set SOURCE_ENDPOINT in your env file}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:?Set DB_NAME in your env file}
      DB_USER: ${DB_USER:?Set DB_USER in your env file}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your env file}
      OUTPUT_PATH: ${OUTPUT_PATH:-/app/output}
      FIXTURE_DIR: /app/fixtures
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ${HOST_OUTPUT_PATH:-./output}:${OUTPUT_PATH:-/app/output}
    restart: "no"

volumes:
  postgres-data:
